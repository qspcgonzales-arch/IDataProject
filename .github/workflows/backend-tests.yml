name: Backend Tests & Lint

on:
  push:
    branches: [main, develop, feature/*, fix/*, calibration/*]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: idata_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-django black flake8 bandit

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/stock_barcode_rfid --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 backend/stock_barcode_rfid --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Format check with black
        run: |
          black --check backend/stock_barcode_rfid

      - name: Security check with bandit
        run: |
          bandit -r backend/stock_barcode_rfid -ll || true

      - name: Run unit tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: idata_test
        run: |
          cd backend
          pytest tests/ -v --cov=stock_barcode_rfid --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            backend/htmlcov/
            backend/.coverage

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install mypy pylint

      - name: Type check with mypy
        run: |
          mypy backend/stock_barcode_rfid --ignore-missing-imports || true

      - name: Lint with pylint
        run: |
          pylint backend/stock_barcode_rfid --disable=all --enable=E,F || true
