name: Android Build & Lint

on:
  push:
    branches: [main, develop, feature/*, fix/*, calibration/*]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'android/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Run lint checks
        run: |
          cd android
          ./gradlew lint

      - name: Run ktlint format check
        run: |
          cd android
          ./gradlew ktlintCheck || true

      - name: Run unit tests
        run: |
          cd android
          ./gradlew test --info

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Run Android Lint
        run: |
          cd android
          ./gradlew lintDebug || true

      - name: Archive build artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: android-build-artifacts
          path: |
            android/app/build/outputs/apk/
            android/app/build/reports/

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Run OWASP Dependency Check
        run: |
          cd android
          ./gradlew dependencyCheck || true

      - name: Check for hardcoded secrets
        run: |
          cd android
          if grep -r "password\|api_key\|secret" --include="*.kt" --include="*.xml" app/src/main; then
            echo "WARNING: Possible hardcoded secrets found"
            exit 1
          fi
        continue-on-error: true

      - name: Archive security reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: android-security-reports
          path: |
            android/app/build/reports/dependency-check/

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Run detekt (static analysis)
        run: |
          cd android
          ./gradlew detekt || true

      - name: Archive detekt reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: android-detekt-reports
          path: android/app/build/reports/detekt/
