name: Security & OWASP Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly security scan (Sundays at 2 AM UTC)
    - cron: '0 2 * * 0'

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Detect secrets with truffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --json --only-verified
        continue-on-error: true

      - name: Check for common secrets in code
        run: |
          if grep -r "password.*=\|api_key.*=\|secret.*=\|token.*=" \
            --include="*.py" --include="*.kt" --include="*.yml" --include="*.json" \
            backend/ android/ | grep -v ".example" | grep -v "change_me"; then
            echo "ERROR: Hardcoded secrets detected!"
            exit 1
          fi

  dependency-check-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: |
          pip install pip-audit

      - name: Audit Python dependencies
        run: |
          pip-audit --desc backend/requirements.txt || true

  dependency-check-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Run OWASP Dependency-Check
        run: |
          cd android
          ./gradlew dependencyCheck || true

  sast-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Bandit (Python security linter)
        run: pip install bandit

      - name: Run Bandit on backend
        run: |
          bandit -r backend/stock_barcode_rfid -f json -o bandit-report.json || true

      - name: Archive Bandit report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-security-report
          path: bandit-report.json

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'java']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  compliance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for documentation
        run: |
          if [ ! -f ARCHITECTURE.md ]; then exit 1; fi
          if [ ! -f SECURITY.md ]; then exit 1; fi
          if [ ! -f API_CONTRACT.md ]; then exit 1; fi
          if [ ! -f DEVELOPMENT.md ]; then exit 1; fi

      - name: Check for license
        run: |
          if [ ! -f LICENSE ]; then exit 1; fi

      - name: Verify .gitignore exists
        run: |
          if [ ! -f .gitignore ]; then exit 1; fi

      - name: Check commit signing (recommended)
        run: |
          echo "Note: Consider enabling commit signing for security"
          echo "See: https://docs.github.com/en/authentication/managing-commit-signature-verification"
