[options]
; ──────────────────────────────────────────────────────────────
; Odoo configuration for local Docker Compose development
; Copy this file to /etc/odoo/odoo.conf inside the container
; (docker-compose.yml mounts it at that path read-only)
; ──────────────────────────────────────────────────────────────

; Database
db_host = postgres
db_port = 5432
db_user = odoo
db_password = odoo
db_name = idata_dev

; Addons
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/backend

; Logging
logfile = /var/log/odoo/odoo.log
log_level = info

; HTTP
http_interface = 0.0.0.0
http_port = 8069
longpolling_port = 8072

; Worker processes (0 = single-process / dev mode)
workers = 0

; Session
session_expiration = 7200

; Security — set a strong master password in production
admin_passwd = admin

; Development helpers
dev_mode = reload,qweb,werkzeug,xml
