[pytest]
# pytest configuration for IDataProject backend

# Minimum Python version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --color=yes
    --disable-warnings

# Coverage options
# Run: pytest --cov=stock_barcode_rfid --cov-report=html
testpaths = tests

# Markers for test categorization
markers =
    unit: Unit tests (no database required)
    integration: Integration tests (requires database)
    slow: Slow tests (skip with -m 'not slow')
    security: Security-focused tests
    e2e: End-to-end tests

# Django/Odoo settings (if using pytest-django)
DJANGO_SETTINGS_MODULE = odoo.settings

# Timeout for long-running tests (seconds)
timeout = 300

# Log capturing
log_cli = true
log_cli_level = DEBUG
log_file = tests/pytest.log
log_file_level = DEBUG
